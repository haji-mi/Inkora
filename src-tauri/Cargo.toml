[package]
name = "inkora"
version = "0.1.0"
description = "Inkora - Markdown Desktop Editor"
authors = ["Inkora Team"]
license = "MIT"
repository = "https://github.com/haji-mi/Inkora"
edition = "2024"
rust-version = "1.90"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "Inkora"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.1", features = [] }
tauri-plugin-log = "2"
